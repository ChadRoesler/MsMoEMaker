name: Docs / Wiki Drift Review

on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  open-review-issue:
    runs-on: ubuntu-latest
    steps:
      # The review script checks that the docs it names still EXIST, so it
      # needs the tree. Without this it can only print a list and hope.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Create monthly docs/wiki drift review issue
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const yyyy = now.getUTCFullYear();
            const mm = String(now.getUTCMonth() + 1).padStart(2, '0');
            const title = `Docs/wiki drift review ${yyyy}-${mm}`;

            const { owner, repo } = context.repo;

            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            if (existing.data.some(i => i.title === title)) {
              core.info(`Issue already exists: ${title}`);
              return;
            }

            // THE CHECKLIST NAMES REAL FILES, AND SAYS SO WHEN IT DOESN'T.
            //
            // This list used to point at docs/CLI.md, docs/ARCHITECTURE.md,
            // docs/TROUBLESHOOTING.md and docs/SOURCE_OF_TRUTH.md - four paths
            // that came over with this workflow from a sibling repo and have
            // never existed here. The docs live in wiki/ and the two READMEs.
            // So the monthly issue handed a reader a checklist that was mostly
            // fiction, and nothing anywhere said so.
            //
            // A guard against staleness must not be able to go stale in
            // silence. Each path below is stat'd before it is printed: a doc
            // that moves comes back as MISSING in the issue body instead of
            // sitting there as an unnoticed dead checkbox. Fixing the drift
            // guard is then itself one of the checkboxes.
            const fs = require('fs');

            const checks = [
              ['README.md',
               'quick-start commands still match real CLI behavior'],
              ['MsMoEMaker/README.md',
               'package README still matches real CLI behavior + recipe options'],
              ['wiki/CLI-Reference.md',
               'commands, flags and env vars match `ms-moe-maker --help` / `describe`'],
              ['wiki/Architecture.md',
               'stage list, module table and contracts match `stages.py`'],
              ['wiki/Troubleshooting-Signatures.md',
               'refreshed with real failure signatures seen since last review'],
              ['wiki/Recipe-Options-Reference.md',
               'every recipe block that exists in `recipe.py` is documented'],
              ['wiki/Glossary.md',
               'terms introduced by new stages/registries have entries'],
              ['wiki/Home.md',
               'handbook map + sidebar list every page actually in wiki/'],
            ];

            const lines = [];
            const missing = [];

            for (const [path, what] of checks) {
              if (fs.existsSync(path)) {
                lines.push(`- [ ] \`${path}\` - ${what}`);
              } else {
                missing.push(path);
                lines.push(`- [ ] **MISSING: \`${path}\`** - path moved or was renamed; fix this workflow's \`checks\` list`);
              }
            }

            // Pages present on disk but absent from the sidebar are the other
            // direction of the same drift: written, synced, and unreachable.
            let orphanNote = [];
            try {
              const sidebar = fs.readFileSync('wiki/_Sidebar.md', 'utf8');
              const orphans = fs.readdirSync('wiki')
                .filter(f => f.endsWith('.md'))
                .map(f => f.slice(0, -3))
                .filter(n => n !== '_Sidebar' && !sidebar.includes(`(${n})`));
              if (orphans.length) {
                orphanNote = [
                  '',
                  `Pages not linked from \`_Sidebar.md\`: ${orphans.map(o => '`' + o + '`').join(', ')}`
                ];
              }
            } catch (e) {
              orphanNote = ['', '_Could not read `wiki/_Sidebar.md` to check for orphan pages._'];
            }

            const body = [
              'Monthly documentation drift review checklist:',
              '',
              ...lines,
              '- [ ] Every wiki page carries a current `Validated against commit/tag`',
              '- [ ] Anything the READMEs document at depth has at least a wiki entry point',
              ...orphanNote,
              '',
              missing.length
                ? `WARNING: ${missing.length} canonical path(s) in this workflow no longer exist. Fix the \`checks\` list in \`.github/workflows/docs-drift-review.yml\` as part of this review.`
                : 'Canonical policy: the wiki reference pages define behavior (see `wiki/Home.md`); the READMEs are the deep narrative.'
            ].join('\n');

            const labels = ['documentation', 'docs-drift', 'wiki-sync'];
            let applied = [];

            try {
              const repoLabels = await github.rest.issues.listLabelsForRepo({ owner, repo, per_page: 100 });
              const known = new Set(repoLabels.data.map(l => l.name));
              applied = labels.filter(l => known.has(l));
            } catch (e) {
              core.info('Could not enumerate labels; proceeding without optional labels.');
            }

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: applied
            });
