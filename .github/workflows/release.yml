name: CI / Release

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

# ── Test matrix ───────────────────────────────────────────────────────────
jobs:
  test:
    runs-on: ubuntu-latest
    name: "Test py${{ matrix.python-version }}"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs full history + tags

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev extras
        run: pip install -e ".[dev]"
        working-directory: MsMoEMaker
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

      - name: Run tests
        run: python -m pytest tests/ -v
        working-directory: MsMoEMaker

# ── Build + GitHub Release (tags only) ────────────────────────────────────
  # ── Install shapes ──────────────────────────────────────────────────────
  #
  # `test` installs [dev] and runs pytest FROM INSIDE the repo. That proves the
  # code works with every dev dependency present and ./ms_moe_maker on sys.path.
  # It proves nothing about what an operator gets from `pip install ms-moe-maker`.
  #
  # The failure classes this catches, for a CLI specifically:
  #   1. A console script that did not install. `test` never types `ms-moe-maker`,
  #      it runs pytest - so a broken entry point is invisible there and fatal
  #      for both the person following the README and seren-theatre[stagehand],
  #      which forks that exact command.
  #   2. An unconditional import of a dependency that only the dev install
  #      provides - invisible when [dev] pulls it in, fatal on a bare install.
  #   3. Dependency creep. ms-moe-maker must stay small enough to validate a recipe
  #      on a laptop with no GPU; the day torch turns up in its requirements,
  #      that promise is gone and nothing else would notice.
  #
  # So: install the shape an operator actually asks for, then exercise the CLI
  # FROM OUTSIDE THE REPO, so ./ms_moe_maker on sys.path cannot mask a missing piece.
  #
  # Every shape runs on every push, including the slow ones, and this job GATES
  # the release. The maintainer eats the CI time so nobody eats a broken install.
  install-shapes:
    runs-on: ubuntu-latest
    name: "Install ${{ matrix.shape.label }}"
    strategy:
      fail-fast: false
      matrix:
        shape:
          - { label: "bare", spec: "." }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ${{ matrix.shape.spec }}
        run: pip install "${{ matrix.shape.spec }}"
        working-directory: MsMoEMaker
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

      # THE OTHER SHAPE, PROVEN WITHOUT PAYING FOR IT.
      #
      # The matrix installs `bare`, which is the shape whose promises matter
      # most - but it means nothing exercises [train], and an extra that names
      # a package that does not exist, or pins an impossible version, fails at
      # the worst possible moment: on someone else's GPU box, after they typed
      # the command the README told them to.
      #
      # Actually installing it costs ~2 GB of torch on every push. `--dry-run`
      # runs the real resolver against the real index and writes the plan it
      # WOULD execute, downloading no wheels - so the failure mode this
      # catches (unresolvable extra) is caught, and the one it does not
      # (a wheel that installs but does not import) is already covered on the
      # box that runs a build.
      - name: Prove [train] resolves (no wheels downloaded)
        run: |
          pip install --dry-run --quiet --report /tmp/train.json '.[train]'
          python - <<'PY'
          import json
          plan = json.load(open("/tmp/train.json"))
          names = sorted(i["metadata"]["name"].lower() for i in plan["install"])
          assert "torch" in names, f"[train] resolved without torch: {names[:20]}"
          print(f"[train] resolves: {len(names)} packages, torch included")
          PY
        working-directory: MsMoEMaker
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

      - name: Exercise the CLI OUT OF TREE
        # NOT "import and construct the app". ms-moe-maker has no app, and that is
        # the design rather than an omission: it is a build pipeline's CLI and
        # its contract, deliberately Seren-agnostic, with no FastAPI, no
        # seren-meninges and no HTTP surface. The service-shaped smoke test
        # every sibling runs is exactly right for a service and wrong here.
        #
        # cd to a scratch dir first. Running from the repo puts ./ms_moe_maker on
        # sys.path, which is precisely how a missing dependency stays hidden.
        run: |
          cd "$(mktemp -d)"

          # 1. The CONSOLE SCRIPT must be on PATH. This is the string a person
          #    types and the string seren-theatre[stagehand] forks - if the
          #    entry point did not install, both break and neither says why.
          ms-moe-maker describe > describe.json
          python - <<'PY'
          import json
          d = json.load(open("describe.json"))
          assert d["name"] == "ms-moe-maker", d
          # Pinned EXACTLY, not as a subset: adding a verb is a release
          # decision, same as bumping the manifest schema. If this fails
          # because a verb was added on purpose, update the set on purpose.
          #
          # `corpus` was added on purpose: it reports corpus health and, with
          # --prune, PROPOSES a cleaner copy. It exists because a C# corpus
          # once reached its token quota from a single repository - 78% of
          # files importing one proprietary namespace - and trained an expert
          # in one company's house style that every other check in the package
          # reported as healthy.
          assert set(d["commands"]) == {
              "init", "build", "corpus", "smoke", "eval", "validate",
              "describe"}, d
          # EVAL MODES ARE ALSO A CONTRACT, and were not being checked at all.
          # A consumer asking for --mode routing has to keep getting routing,
          # so removing or renaming one is breaking exactly like a verb.
          # ADDING one is not: stagehand's existing --mode values keep meaning
          # what they meant, which is why `experts` could land without a
          # release decision. Pinned as a SUBSET for that reason - the check
          # that matters is that nothing vanished.
          assert {"routing", "quality", "all"} <= set(d["eval_modes"]), d
          # DESCRIBE PUBLISHES THIS LIST TWICE, under `eval_modes` and `modes`.
          # Two names for one fact is two things to forget to update, and a
          # consumer keying off the stale one would silently ask for a mode
          # that no longer exists. Assert they agree until one of them goes.
          assert list(d["modes"]) == list(d["eval_modes"]), (
              f"modes and eval_modes disagree: {d['modes']} vs "
              f"{d['eval_modes']}")
          # The run manifest schema is a PUBLISHED contract - seren-theatre
          # reads it with an independent implementation and refuses a version
          # it does not understand. Bumping it is a release decision, so it
          # gets asserted rather than assumed.
          assert isinstance(d["manifest_schema_version"], int), d
          assert d["requires"] == [], f"ms-moe-maker must require nothing: {d}"
          print(f"describe OK - manifest schema v{d['manifest_schema_version']}")
          PY

          # 2. THE LAPTOP PROMISE. ms-moe-maker is the CLI and the contract, not the
          #    trainer; the heavy machinery lives in whatever venv the pipeline
          #    trains in. If torch ever lands here, `ms-moe-maker validate` stops
          #    being something you can run BEFORE going near a GPU box, and
          #    that split is the whole reason the package is separate.
          python - <<'PY'
          from importlib.metadata import distribution
          import ms_moe_maker
          from ms_moe_maker import manifest, stages, levers, runner, recipe  # noqa: F401

          # Assert what ms-moe-maker DECLARES, not what happens to be importable.
          # Ambient importability is a correlation - a runner image, or another
          # package installed alongside, can make torch importable without
          # ms-moe-maker having anything to do with it, and the check would fail on
          # working software. The declared requirement set is true by
          # construction, so that is what gets asserted.
          HEAVY = ("torch", "transformers", "datasets", "trl", "accelerate",
                   "fastapi", "uvicorn", "seren")
          reqs = distribution("ms-moe-maker").requires or []

          # THE PROMISE IS ABOUT THE BASE INSTALL, so the check is too.
          #
          # `pip install ms-moe-maker` must pull nothing heavy - that is what
          # keeps `validate` runnable before you go near a GPU box. An EXTRA
          # does not touch that: it is opt-in and additive, and nobody gets it
          # unless they type it.
          #
          # A requirement carrying an `extra == "..."` marker is conditional by
          # construction, so it is excluded here. Anything without a marker is
          # unconditional and is exactly what this check exists to catch.
          unconditional = [r for r in reqs if "extra ==" not in r]
          heavy = [r for r in unconditional
                   if any(h in r.split(";")[0].lower() for h in HEAVY)]
          assert not heavy, (
              f"ms-moe-maker declares {heavy} UNCONDITIONALLY. The CLI and the "
              f"contract stay small enough to run on a laptop with no GPU. If "
              f"a build stage needs this, it belongs in the [train] extra.")

          # AND THE OTHER HALF. Loosening a check without adding one is how a
          # guarantee quietly becomes a habit. The split is a two-sided claim -
          # base is clean AND there is a declared, installable way to get what
          # a build box needs - so assert both. Otherwise [train] could be
          # dropped tomorrow and nothing would notice until someone tried to
          # follow the README.
          extras = distribution("ms-moe-maker").metadata.get_all("Provides-Extra") or []
          assert "train" in extras, (
              f"the [train] extra is gone (extras: {extras}). Without it there "
              f"is no machine-readable statement of what a build box needs, "
              f"and that knowledge falls back to prose.")
          train_reqs = [r for r in reqs if 'extra == "train"' in r]
          assert any("torch" in r for r in train_reqs), (
              f"[train] does not declare torch: {train_reqs}")

          # THE TABLE HAS TO SHIP. ms_moe_maker/defaults.yaml is the real
          # defaults table — the Python FLOOR is only a panic minimum — so a
          # wheel without it behaves differently from a checkout, quietly.
          import pathlib, ms_moe_maker
          _d = pathlib.Path(ms_moe_maker.__file__).parent / "defaults.yaml"
          assert _d.is_file(), (
              f"defaults.yaml missing from the installed package ({_d}). "
              f"Check [tool.setuptools.package-data] in pyproject.toml.")
          from ms_moe_maker import defaults as _defmod
          _resolved, _, _warns = _defmod.resolve(include_user=False)
          assert not _warns, f"packaged defaults.yaml does not parse clean: {_warns}"
          for _blk, _vals in _defmod.FLOOR.items():
              for _k, _v in _vals.items():
                  assert _resolved[_blk][_k] == _v, (
                      f"{_blk}.{_k}: floor and packaged defaults.yaml disagree")

          # THE THIRD TIER, WHICH IS FREE AND WORTH KEEPING. export and smoke
          # shell out to llama.cpp and import nothing but stdlib, so somebody
          # handed a finished MoE can convert it and PROVE IT GENERATES on a
          # bare install. That is not an accident to be discovered later, it is
          # a property, so it gets a test.
          import subprocess, sys as _sys
          probe = subprocess.run(
              [_sys.executable, "-c",
               "import ms_moe_maker.export as e; assert e.smoke_gguf and e.export_gguf"],
              capture_output=True, text=True)
          assert probe.returncode == 0, (
              "ms_moe_maker.export no longer imports on a base install:\n"
              + probe.stderr[-2000:])

          print(f"deps declared: {reqs}")
          print(f"extras: {extras}")
          print("export/smoke import clean on the base install")
          print(f"imports clean (ms-moe-maker {ms_moe_maker.__version__})")
          PY

          # 3. VALIDATE ACTUALLY RUNS, out of tree, on the shipped example.
          #    A recipe that the package's own README hands to a stranger has
          #    to parse with only what `pip install ms-moe-maker` provides.
          python - <<'PY'
          import os, pathlib, subprocess, json
          # os.environ, NOT "$GITHUB_WORKSPACE" in the string: this heredoc is
          # quoted ('PY'), so the shell does not expand anything inside it. The
          # literal would never resolve, the check would skip on every run, and
          # a check that can only skip is not a check.
          ws = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          src = ws / "MsMoEMaker" / "recipe.example.yaml"
          assert src.is_file(), (
              f"recipe.example.yaml is missing at {src}. The README hands it "
              f"to a stranger, so it has to exist and it has to parse.")
          out = subprocess.run(["ms-moe-maker", "validate", str(src), "--json"],
                               capture_output=True, text=True)
          # A refusal (exit 1) is a legitimate answer and NOT a CI failure -
          # it means the recipe asks for something the pipeline cannot honour
          # yet, which is the tool working. Only a crash is a failure.
          assert out.returncode in (0, 1), (
              f"validate exited {out.returncode}\n{out.stderr[-2000:]}")
          events = [json.loads(l) for l in out.stdout.splitlines() if l.strip()]
          kinds = [e["event"] for e in events]
          assert kinds and kinds[-1] == "done", f"no terminal event: {kinds}"
          print(f"validate OK - events: {kinds}")
          PY

  build-and-release:
    needs: [test, install-shapes]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm reads the full tag graph

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build frontend
        run: pip install build

      - name: Build wheel and sdist
        # setuptools-scm derives the version from the git tag automatically.
        # No sed patching needed - __version__ is resolved at runtime via
        # importlib.metadata.
        run: python -m build
        working-directory: MsMoEMaker

      - name: Upload dist as artifact (handed to the publish job)
        uses: actions/upload-artifact@v4
        with:
          name: ms-moe-maker-dist
          path: MsMoEMaker/dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MsMoEMaker/dist/*
          generate_release_notes: true

# ── PyPI publish (Trusted Publishing, tokenless) ──────────────────────────
  pypi-publish:
    needs: [build-and-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ms-moe-maker
    permissions:
      id-token: write   # MANDATORY for Trusted Publishing; job-level = least privilege
    steps:
      - name: Download the built dist
        uses: actions/download-artifact@v8
        with:
          name: ms-moe-maker-dist
          path: dist/

      - name: Publish to PyPI (tokenless)
        uses: pypa/gh-action-pypi-publish@release/v1