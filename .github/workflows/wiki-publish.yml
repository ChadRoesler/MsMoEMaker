name: Wiki Publish

on:
  push:
    branches: ["master"]
    paths:
      - "MsMoEMaker/wiki/**"
      - ".github/workflows/wiki-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout wiki repo (PAT)
        if: ${{ secrets.WIKI_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.WIKI_TOKEN }}
          fetch-depth: 0

      - name: Checkout wiki repo (GITHUB_TOKEN fallback)
        if: ${{ secrets.WIKI_TOKEN == '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync wiki content
        run: |
          test -d MsMoEMaker/wiki
          rsync -av --delete MsMoEMaker/wiki/ wiki/

      - name: Show synced wiki files
        run: |
          ls -la wiki

      - name: Commit and push if changed
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to publish."
            exit 0
          fi
          git commit -m "Sync wiki from repo ${GITHUB_SHA}"
          git push
