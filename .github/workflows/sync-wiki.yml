name: Sync Wiki

on:
  push:
    branches:
      # BOTH SPELLINGS ON PURPOSE. This repo's default branch is master,
      # and this trigger said `main` only - so the push path never fired
      # once and every sync you ever got was a manual dispatch. It did not
      # fail, it just never ran, which is the worst shape for it.
      #
      # Listing both means a future rename cannot silently stop the sync
      # again. The literal here only decides what WAKES the workflow; the
      # job-level guard below decides whether it SYNCS, and that guard
      # reads the repo's own declared default branch instead of trusting a
      # branch name written down in this file.
      - main
      - master
    paths:
      - 'wiki/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync even if no changes detected'
        type: boolean
        default: false

jobs:
  sync-wiki:
    runs-on: ubuntu-latest

    # Only the default branch publishes the wiki. Derived from the repo's
    # own `default_branch` rather than a hardcoded name, so renaming the
    # branch moves the finder and the guard together.
    #
    # workflow_dispatch is deliberately exempt: a manual run from any
    # branch is a person asking on purpose, and refusing that would just
    # recreate the silent no-op this whole edit exists to delete.
    if: >-
      github.event_name != 'push' ||
      github.ref_name == github.event.repository.default_branch
    
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v7
        with:
          path: main
          fetch-depth: 1

      - name: Checkout wiki repo
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
          token: ${{ secrets.WIKI_PAT || github.token }}

      - name: Show source files
        run: |
          echo "=== Files in main/wiki/ ==="
          ls -la main/wiki/ || echo "No wiki folder!"
          echo ""
          echo "=== Markdown file count in main/wiki/ ==="
          find main/wiki -name "*.md" 2>/dev/null | wc -l

      - name: Show current wiki repo state
        run: |
          echo "=== Files currently in wiki-repo/ ==="
          ls -la wiki-repo/ || echo "Empty!"
          echo ""
          echo "=== Markdown file count in wiki-repo/ ==="
          find wiki-repo -maxdepth 1 -name "*.md" 2>/dev/null | wc -l

      - name: Sync wiki content
        run: |
          # Check if wiki folder exists in main repo
          if [ ! -d "main/wiki" ]; then
            echo "? No wiki folder found in main repo!"
            exit 1
          fi
          
          # Count source files
          SOURCE_COUNT=$(find main/wiki -maxdepth 1 -name "*.md" | wc -l)
          echo "?? Found $SOURCE_COUNT markdown files to sync"
          
          # Remove old wiki content (except .git)
          echo "?? Cleaning wiki-repo..."
          find wiki-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          
          # Copy new content from main repo's wiki folder
          echo "?? Copying files..."
          cp -rv main/wiki/* wiki-repo/
          
          # Verify copy
          DEST_COUNT=$(find wiki-repo -maxdepth 1 -name "*.md" | wc -l)
          echo ""
          echo "? Copied $DEST_COUNT markdown files to wiki-repo"
          
          # List all files
          echo ""
          echo "=== Files now in wiki-repo/ ==="
          ls -la wiki-repo/*.md

      - name: Push to wiki
        run: |
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Show git status
          echo "=== Git status ==="
          git status
          
          # Add all files
          git add -A
          
          # Show what will be committed
          echo ""
          echo "=== Files staged for commit ==="
          git diff --cached --name-status
          
          # Check if there are changes (unless force is enabled)
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" != "true" ]; then
            if git diff --cached --quiet; then
              echo ""
              echo "? No changes to sync - wiki is already up to date"
              exit 0
            fi
          fi
          
          # Commit and push
          echo ""
          echo "?? Committing and pushing..."
          git commit -m "Sync wiki from main repo @ ${{ github.sha }}"
          git push
          
          echo ""
          echo "? Wiki synced successfully!"