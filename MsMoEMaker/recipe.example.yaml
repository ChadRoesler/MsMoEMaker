# Ms.MoE — minimal recipe.
#
# The bare minimum is: name, one or more experts with sources, and size.
# Everything else auto-fills from your hardware tier (nano / xavier / spark).
#
#   ms-moe-maker validate recipe.example.yaml   # check structure
#   ms-moe-maker build recipe.example.yaml      # build (needs GPU, torch)
#   ms-moe-maker smoke recipe.example.yaml      # smoke-test GGUF
#   ms-moe-maker eval recipe.example.yaml       # eval experts vs MoE
#
# Quick start with a template (auto-fills base, size, experts, budget):
#   ms-moe-maker validate --template dnd recipe.example.yaml

schema_version: 1
name: dnd-moe-example

# ── template ──────────────────────────────────────────────────────────────────
# Pick one: code | dnd | math | culinary
# This auto-fills base, size, experts, and budget.  You can override any of
# the fields below after the fact.
#
# template: dnd

# ── experts ──────────────────────────────────────────────────────────────────
# Each expert needs a name and a source. Source kinds:
#
#   stack  — pull from bigquery code stack-v3 by language
#   hf     — pull from HuggingFace (repo + text_field)
#   local  — pull from a directory of .txt/.jsonl/.md files
#   synth  — generate synthetic traces (needs a teacher model)
#
# For non-code domains (DnD, math, culinary, etc.), use kind=hf or kind=local.

experts:

  # 1. Monster Manual expert — pulls the official DnD stat block corpus
  - name: monster_manual
    source:
      kind: hf
      repo: PleiaSys/DnD-MonsterManual
      text_field: text

  # 2. Dungeon Master's Guide expert
  - name: dmd_guide
    source:
      kind: hf
      repo: PleiaSys/DnD-DungeonMastersGuide
      text_field: text

  # 3. Player's Handbook expert
  - name: players_handbook
    source:
      kind: hf
      repo: PleiaSys/DnD-PlayersHandbook
      text_field: text

# ── size ─────────────────────────────────────────────────────────────────────
# Pick from: 0.5B  1.5B  3B  9B  36B
#
# If you omit it or write "auto", the hardware tier picks the default.
#   nano (3GB)   → 3B    (GGUF Q4_K_M)
#   xavier (9GB) → 9B    (GGUF Q5_K_M)
#   spark (36GB) → 36B   (GGUF Q8_0)
#
# This recipe defaults to auto → picked from tier.

size: auto

# ── optional overrides ──────────────────────────────────────────────────────
# These are all optional. The recipe below is fully valid without them.
#
# base: huihui-ai/Qwen2.5-3B-Instruct-abliterated
#
# budget:
#   target_steps: 150          # shakedown; 1200+ for production
#   max_seq_length: 2048
#   per_device_batch: 4
#   grad_accum: 2
#   warmup_ratio: 0.05
#
# moe:
#   experts_per_tok: 2
#   norm_topk_prob: true
#   aux_loss_coef: 0.001
#   shared_expert_width: 1
#   dense_layers: auto
#
# gates:
#   base_evals: auto
#   main_evals: manual
#
# abliterate: true             # decensor the base first (vendored Heretic core)
#
# Or a mapping:
# abliterate:
#   n_trials: 200              # Optuna trials (-1 = default 200)
#   seed: 42                   # reproducible study (null = random)
#   quantization: none         # none | bnb_4bit
#   trial_index: null          # null = first Pareto-front trial
#   checkpoint_action: continue   # continue | restart
#   export: merge              # merge | adapter
#
# runtime:
#   dtype: bfloat16
#   direct_load: true
#
# roots:
#   data: msmoe_data
#   output: msmoe_{size}
