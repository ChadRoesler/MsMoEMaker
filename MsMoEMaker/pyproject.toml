[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-moe-maker"
dynamic = ["version"]
description = "Build a mixture of experts from deliberately chosen specialists. Not a coding model - a coding model shaped like your stack."
license = "GPL-3.0-only"
requires-python = ">=3.10"
authors = [{ name = "Chad Roesler" }]
readme = "README.md"
keywords = ["moe", "mixture-of-experts", "qwen", "fine-tuning", "gguf", "llm"]

# DELIBERATELY TINY BASE. `describe`, `validate` and `build --plan` need
# nothing but pyyaml, and that is the reason: someone should be able to check a
# recipe, read what it will cost and see which fields cannot be honoured on a
# laptop with no GPU, before they go anywhere near a machine that can run it.
#
# (This comment used to say the heavy machinery "belongs to the PIPELINE it
# forks". That was true under wrap-then-carve, when this package drove
# fraunkenstein_universal.py as a subprocess. The carve is finished - the
# pipeline IS this package now - so the honest split is base vs [train], not
# CLI vs forked script.)
#
# Every torch/transformers import in the package is INSIDE a function, so the
# base install imports cleanly and the training deps are only touched when you
# actually build.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# `pip install ms-moe-maker[train]` on the box that does the work.
#
# safetensors is not optional-within-this-extra: the stitcher streams tensors
# one at a time out of safetensors files, which is what keeps peak memory at
# roughly one shard instead of the whole model.
train = [
    "torch>=2.0",
    "transformers>=4.40",
    "datasets>=2.14",
    "safetensors>=0.4",
    "accelerate>=0.30",
    "peft>=0.10",
    "trl>=0.9",
    "huggingface-hub>=0.23",
    "bitsandbytes>=0.46.1",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ms-moe-maker = "ms_moe_maker.__main__:main"

[project.urls]
Homepage = "https://github.com/ChadRoesler/MsMoEMaker"
Repository = "https://github.com/ChadRoesler/MsMoEMaker"
"Bug Tracker" = "https://github.com/ChadRoesler/MsMoEMaker/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ms_moe_maker*"]

# DATA THAT SHIPS. defaults.yaml is the real defaults table (the Python FLOOR
# is only a panic minimum), so a wheel without it is a wheel that quietly
# behaves differently. CI asserts it is present in the built artifact.
[tool.setuptools.package-data]
ms_moe_maker = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools_scm]
# .git is one level above pyproject.toml (repo root, not the MsMoEMaker subdir) -
# same nested layout as every sibling repo.
root = ".."
version_scheme = "release-branch-semver"
version_file = "ms_moe_maker/_version.py"
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+.*)$"
fallback_version = "0.0.0.dev0"
