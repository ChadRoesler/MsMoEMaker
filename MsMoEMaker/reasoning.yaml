TagStyles:
  - TagStyleName: Standard XML Style
    OpeningTag: "<think>"
    ClosingTag: "</think>"
    Interwoven: false
  - TagStyleName: Interleaved Agentic XML
    OpeningTag: "<think>"
    ClosingTag: "</think>"
    Interwoven: true
  - TagStyleName: Markdown Code Fence
    OpeningTag: "```thought"
    ClosingTag: "```"
    Interwoven: false
  - TagStyleName: System Header Identification
    OpeningTag: "<|start_header_id|>thought<|end_header_id|>"
    ClosingTag: "<|start_header_id|>assistant<|end_header_id|>"
    Interwoven: false

Families:
  - FamilyName: DeepSeek Family
    Models:
      - DeepSeek-R1
      - DeepSeek V4
    PreferredStyle: Standard XML Style
  - FamilyName: Kimi Family
    Models:
      - Kimi K2
      - Kimi K3
    PreferredStyle: Interleaved Agentic XML
  - FamilyName: Qwen Family
    Models:
      - Qwen2.5-Math
      - Qwen2.5-Instruct-CPI
      - Qwen3
    PreferredStyle: Standard XML Style
  - FamilyName: OpenThink Family
    Models:
      - OpenThink-Qwen
      - OpenThink-Llama
    PreferredStyle: Standard XML Style
  - FamilyName: Llama Base Family
    Models:
      - Llama 3.1
      - Llama 3.2
      - Llama 3.3
    PreferredStyle: System Header Identification
